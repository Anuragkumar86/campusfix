{% extends "django_demo/base.html" %}
{% block title %}Demo login{% endblock %}
{% block content %}
<h1>Log in (Django authentication)</h1>
<form method="post" class="card">{% csrf_token %}
  {{ form.non_field_errors }}
  <p><label for="{{ form.username.id_for_label }}">Email</label><br>{{ form.username }}{{ form.username.errors }}</p>
  <p><label for="{{ form.password.id_for_label }}">Password</label><br>{{ form.password }}{{ form.password.errors }}</p>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Log in</button>
</form>
{% endblock %}
